# SDR Radio page layout for MPC OS (shadow_page.conf syntax, see
# mpc-vst-plugins tools/shadow_skin.py). Drawn by the browser renderer
# ("art": "html" in vst.json) with skin.css, in the desktop plugin's colours.
# Coordinates: 1280 wide, the plugin area is y=86..714. Q-Links: every 4 keys
# are one column, one press of the MPC One's Q-Link button.

theme_bg=16181c
theme_panel=1c1f24
theme_line=2e3239
theme_ink=ecebe8
theme_ink_dim=9aa0a8
theme_ink_faint=5d636c
theme_accent=ffb347
theme_accent_hi=ffb347
theme_lcd=0b0d0f
theme_box=0b0d0f
theme_knob_face=2a2e34
theme_knob_ring=3a3f47
theme_knob_dot=ffb347
theme_seg_active=ffb347
theme_seg_active_tx=16181c
theme_seg_inactive=23262b
theme_btn_bg=2a2e34
theme_btn_text=ecebe8
theme_btn_text_plain=ecebe8
theme_btn_on=ffb347
theme_tile_on=4a3413
art_css=skin.css
label_scale=1.35
scale_names=1

[tab RADIO]
frame x=10 y=92 w=1260 h=176 title="SDR RADIO"
readout cx=400 cy=196 w=740 h=104 label="" key=freq_text tsize=96 tcolor=ffb347 tweight=700
readout cx=1025 cy=168 w=470 h=48 label="" key=info tsize=30 tcolor=ecebe8
readout cx=905 cy=224 w=230 h=48 label="" key=status tsize=26 tcolor=9aa0a8
readout cx=1145 cy=224 w=230 h=48 label="" key=signal tsize=26 tcolor=9aa0a8
frame x=10 y=276 w=1260 h=222 title="TUNE"
knob cx=95 cy=378 r=44 label="MHZ" key=mhz bw=140
knob cx=245 cy=378 r=44 label="KHZ" key=khz bw=140
button cx=420 cy=352 w=180 h=60 label="STEP UP" key=tune_up
button cx=420 cy=432 w=180 h=60 label="STEP DOWN" key=tune_down
text cx=665 cy=330 label="MODE" size=1.4 color=9aa0a8
enum_h cx=665 cy=382 label="" key=mode sw=88 sh=58
toggle cx=665 cy=458 label="AUTO MODE" key=mode_auto bw=200
knob cx=880 cy=378 r=44 label="RF GAIN" key=gain bw=130
toggle cx=1010 cy=378 label="AUTO GAIN" key=agc bw=120
knob cx=1170 cy=378 r=44 label="LEVEL" key=level bw=150
frame x=10 y=506 w=1260 h=202 title="PRESETS   tap to tune  /  STORE, then tap to save"
list x=26 y=552 w=1040 h=140 cols=4 rows=2 th=66 gap=8 key=preset tsize=32 tcolor=ecebe8 talign=center
toggle cx=1170 cy=616 label="STORE" key=store bw=180
qlinks "RADIO" = mhz,khz,gain,level,mode,mode_auto,agc,-

[tab SCAN]
frame x=10 y=92 w=1260 h=150 title="SCAN"
readout cx=230 cy=186 w=400 h=88 label="" key=freq_text tsize=76 tcolor=ffb347 tweight=700
readout cx=690 cy=162 w=480 h=42 label="" key=info tsize=26 tcolor=ecebe8
readout cx=690 cy=212 w=480 h=42 label="" key=scan_text tsize=26 tcolor=ffb347
readout cx=1102 cy=162 w=316 h=42 label="" key=chan_state tsize=30 tcolor=ffb347 tweight=700
button cx=1022 cy=214 w=156 h=48 label="KEEP" key=list_add
button cx=1182 cy=214 w=156 h=48 label="BLOCK" key=list_block
frame x=10 y=250 w=1260 h=232 title="HOW"
readout cx=880 cy=268 w=740 h=32 label="" key=hint_text tsize=22 tcolor=9aa0a8
toggle cx=90 cy=320 label="SCAN" key=scan_on bw=140
toggle cx=90 cy=428 label="RANDOM" key=scan_random bw=140
text cx=388 cy=296 label="SOURCE" size=1.4 color=9aa0a8
enum_h cx=388 cy=344 label="" key=scan_src sw=112 sh=56
text cx=388 cy=400 label="STYLE" size=1.4 color=9aa0a8
enum_h cx=388 cy=448 label="" key=scan_style sw=130 sh=56
knob cx=680 cy=372 r=40 label="EVERY" key=scan_rate bw=130
knob cx=815 cy=372 r=40 label="SQUELCH" key=scan_sql bw=130
knob cx=950 cy=372 r=40 label="TEMPO" key=tempo bw=130
