frame x=10 y=490 w=1260 h=218 title="BANDS"
readout cx=820 cy=508 w=860 h=32 label="" key=count_text tsize=22 tcolor=9aa0a8
list x=26 y=540 w=1228 h=152 cols=7 rows=2 th=72 gap=8 key=band tsize=28 tcolor=ecebe8 talign=center
qlinks "SCAN" = scan_on,scan_src,scan_style,scan_random,scan_rate,scan_sql,tempo,-

[tab SAVED]
frame x=10 y=92 w=1260 h=110 title="SAVED AND BLOCKED   shared by both plugins and every project"
readout cx=230 cy=160 w=400 h=64 label="" key=freq_text tsize=56 tcolor=ffb347 tweight=700
readout cx=640 cy=160 w=380 h=48 label="" key=list_text tsize=22 tcolor=ecebe8
enum_h cx=1050 cy=160 label="" key=list_view sw=170 sh=52
frame x=10 y=210 w=1260 h=380 title="CHANNELS   tap to tune"
list x=26 y=256 w=1228 h=320 cols=6 rows=4 th=74 gap=8 key=list tsize=28 tcolor=ecebe8 talign=center
frame x=10 y=598 w=1260 h=110 title=""
button cx=110 cy=652 w=180 h=60 label="< PAGE" key=list_prev
button cx=300 cy=652 w=180 h=60 label="PAGE >" key=list_next
button cx=530 cy=652 w=200 h=60 label="KEEP TUNED" key=list_add
button cx=750 cy=652 w=200 h=60 label="BLOCK TUNED" key=list_block
